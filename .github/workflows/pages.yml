# Build the site from site/build.py and publish it to GitHub Pages (d, 2026-09-28: move the build off the repo so the
# generated pages no longer have to be committed). Settings -> Pages -> Source must be "GitHub Actions".
# If a run fails, the site keeps serving the last successful deploy; nothing goes down.
# Kept to three actions (checkout, upload-pages-artifact, deploy-pages) so there is less to age (d, 06:09).
name: Build and deploy site

on:
  push:
    branches: [website]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # the runner's own python3 is enough: build.py uses the standard library only, so nothing to install or pin
      - name: Build docs/ (standard library only)
        run: python3 --version && python3 site/build.py
      # mirrored media whose original repo changed since its pin (d 2026-10-21): a report in the run summary, never a failure
      - name: Report mirrored-media drift
        run: python3 site/media_drift.py || true
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    # only the website branch deploys: a manual run on another branch (website-media-mirror) builds and stops here
    if: github.ref == 'refs/heads/website'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
